name: CI — producto-service codelab-11

on:
  push:
    branches: [ "codelab/11-producto-service-minio" ]
  pull_request:
    branches: [ "codelab/11-producto-service-minio" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL para los tests de integración
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: curso_springboot
          POSTGRES_USER: devdb
          POSTGRES_PASSWORD: a1b2c3d4
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar tests
        run: mvn verify -B

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/codelab/11-producto-service-minio'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            denkitronik/producto-service:codelab-11
            denkitronik/producto-service:latest
