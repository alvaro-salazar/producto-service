spring.application.name=producto-service
app.version=codelab-11
api.version=v1

# ═══════════════════════════════════════════════════════════
# SERVIDOR WEB
# ═══════════════════════════════════════════════════════════
server.port=8082

# ═══════════════════════════════════════════════════════════
# BASE DE DATOS — PostgreSQL
# ═══════════════════════════════════════════════════════════
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/curso_springboot}
spring.datasource.username=${DB_USERNAME:devdb}
spring.datasource.password=${DB_PASSWORD:a1b2c3d4}
spring.datasource.driver-class-name=org.postgresql.Driver

# ═══════════════════════════════════════════════════════════
# POOL DE CONEXIONES — HikariCP
# ═══════════════════════════════════════════════════════════
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ProductoHikariPool
spring.datasource.hikari.initialization-fail-timeout=-1

# ═══════════════════════════════════════════════════════════
# JPA / HIBERNATE
# ═══════════════════════════════════════════════════════════
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ═══════════════════════════════════════════════════════════
# SEGURIDAD — OAuth2 / Keycloak
# ═══════════════════════════════════════════════════════════
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8090/realms/curso-springboot}

# ═══════════════════════════════════════════════════════════
# MINIO
# ═══════════════════════════════════════════════════════════
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:productos}

# ═══════════════════════════════════════════════════════════
# SPRING ACTUATOR
# ═══════════════════════════════════════════════════════════
management.server.port=8083
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ═══════════════════════════════════════════════════════════
# CARGA DE ARCHIVOS (imágenes de productos)
# ═══════════════════════════════════════════════════════════
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ═══════════════════════════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════════════════════════
logging.level.com.denkitronik.productoservice=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ── Kafka (Saga de inventario) ────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=producto-inventario-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
