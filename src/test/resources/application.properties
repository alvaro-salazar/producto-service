api.version=v1

# ── Tests: desactivar Keycloak (sin servidor real) ─────────────────────────────
# Para @WebMvcTest y @DataJpaTest, desactivamos la validación JWT
# inyectando tokens de prueba con @WithMockUser o MockMvc.with(jwt())
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://test-keycloak/realms/test

# ── @DataJpaTest: H2 en memoria ─────────────────────────────────────────────────
# (Spring Boot auto-configura H2 cuando ve spring-boot-starter-test + h2 en classpath)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ── MinIO: no disponible en unit/slice tests ─────────────────────────────────────
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=productos-test
